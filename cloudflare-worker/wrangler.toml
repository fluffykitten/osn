name = "osn-kimia-mailer"
main = "worker.js"
compatibility_date = "2024-09-01"

# Environment Variables (Bisa diisi via Cloudflare Dashboard -> Settings -> Variables)
[vars]
ADMIN_EMAIL = "fluffykitten.dev@gmail.com"
SENDER_EMAIL = "fluffykitten.dev@gmail.com"
SENDER_NAME = "OSN Kimia Mastery"

# Secrets yang harus ditambahkan via:
# npx wrangler secret put BREVO_API_KEY
# atau via Cloudflare Dashboard -> Workers & Pages -> osn-kimia-mailer -> Settings -> Variables and Secrets -> Add Secret

# Cloudflare R2 Storage Binding untuk Gambar & Diagram
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "osn-storage"

