<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Hexagon Guide -->
  <polygon
    points="32,6 54,19 54,45 32,58 10,45 10,19"
    stroke="#0284C7"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Hexagon Vertex Nodes -->
  <circle cx="32" cy="6" r="2" fill="#06B6D4" />
  <circle cx="54" cy="19" r="2" fill="#818CF8" />
  <circle cx="54" cy="45" r="2" fill="#C084FC" />
  <circle cx="32" cy="58" r="2" fill="#10B981" />
  <circle cx="10" cy="45" r="2" fill="#0D9488" />
  <circle cx="10" cy="19" r="2" fill="#0284C7" />

  <!-- Quantum Orbits -->
  <ellipse cx="32" cy="32" rx="21" ry="8.5" transform="rotate(-35 32 32)" stroke="#C084FC" stroke-width="2.2" />
  <ellipse cx="32" cy="32" rx="21" ry="8.5" transform="rotate(35 32 32)" stroke="#38BDF8" stroke-width="2.2" />

  <!-- Orbit Particles -->
  <circle cx="47" cy="42" r="3" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="17" cy="42" r="2.2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- DNA Base Pair Rungs -->
  <line x1="28" y1="21" x2="36" y2="21" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" />
  <line x1="27" y1="26" x2="37" y2="26" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" />
  <line x1="27" y1="38" x2="37" y2="38" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="43" x2="36" y2="43" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" />

  <!-- DNA Strands -->
  <path d="M 32 14 C 38 14, 40 25, 32 32 C 24 39, 26 50, 32 50" stroke="#10B981" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 32 14 C 26 14, 24 25, 32 32 C 40 39, 38 50, 32 50" stroke="#F43F5E" stroke-width="3.2" stroke-linecap="round" />

  <!-- Central Core Node -->
  <circle cx="32" cy="32" r="4.8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.2" />
  <circle cx="32" cy="32" r="2" fill="#0EA5E9" />
</svg>