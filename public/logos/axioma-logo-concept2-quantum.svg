<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none" role="img" aria-labelledby="c2-title c2-desc">
  <title id="c2-title">Axioma Academy — The Quantum Orbit &amp; Alpha Logo</title>
  <desc id="c2-desc">Dynamic monogram A intersected by an elliptical quantum orbit ring with a golden discovery spark</desc>
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 6)">
    <!-- Orbit Ring Ellipse -->
    <ellipse cx="30" cy="30" rx="26" ry="11" stroke="url(#orbit-grad)" stroke-width="2.5" transform="rotate(-30 30 30)" stroke-dasharray="80 15" />
    <!-- Core Letter A Silhouette -->
    <path d="M 16 48 L 27 12 Q 30 6 33 12 L 44 48" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Crossbar with Spark Node -->
    <path d="M 21 34 L 39 34" stroke="url(#orbit-grad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Radiant Spark in Negative Space -->
    <polygon points="30,19 32,23 36,25 32,27 30,31 28,27 24,25 28,23" fill="#F59E0B" />
    <!-- Orbit Electron Satellite -->
    <circle cx="48" cy="18" r="3" fill="#06B6D4" />
  </g>

  <g transform="translate(75, 43)">
    <text font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.02em" fill="#0F172A">
      Axioma
    </text>
    <text x="100" y="-1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#4F46E5">
      ACADEMY
    </text>
  </g>
</svg>
