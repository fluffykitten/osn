<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none" role="img" aria-labelledby="c4-title c4-desc">
  <title id="c4-title">Axioma Academy — The Infinity Helix Loop Logo</title>
  <desc id="c4-desc">Continuous gradient ribbon forming the letter A with Mobius twist representing infinity and DNA</desc>
  <defs>
    <linearGradient id="helix-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="helix-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="helix-cross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 6)">
    <!-- Left Loop Leg -->
    <path d="M 14 52 C 14 36, 24 10, 30 6 C 33 4, 37 8, 33 18 L 22 46 C 20 50, 15 54, 14 52 Z" fill="url(#helix-left)" />
    <!-- Right Loop Leg -->
    <path d="M 46 52 C 46 36, 36 10, 30 6 C 27 4, 23 8, 27 18 L 38 46 C 40 50, 45 54, 46 52 Z" fill="url(#helix-right)" />
    <!-- Dynamic Continuous Crossbar Wave -->
    <path d="M 12 36 Q 30 46 48 34" stroke="url(#helix-cross)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Focal Photon Point -->
    <circle cx="30" cy="40" r="2.8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
  </g>

  <g transform="translate(75, 43)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.02em" fill="#0F172A">
      Axioma
    </text>
    <text x="100" y="-1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#6366F1">
      ACADEMY
    </text>
  </g>
</svg>
