<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="500" height="580" fill="none" role="img" aria-labelledby="axioma-light-title axioma-light-desc">
  <title id="axioma-light-title">Axioma Academy — STEM Synthesis Emblem (Light Palette)</title>
  <desc id="axioma-light-desc">Geometric hexagon combining DNA double helix, atomic quantum orbits, celestial crosshairs and mathematical symbols on a clean light aesthetic</desc>

  <defs>
    <!-- Gradients for DNA Helix Strands -->
    <linearGradient id="dna-strand-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="dna-strand-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Gradients for Atomic Orbits -->
    <linearGradient id="orbit-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="orbit-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Soft Glow Filter for Particles -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. BACKGROUND GUIDES & GEOMETRY (Dashed Circle, Crosshair, Hexagons) -->
  <!-- ===================================================================== -->
  <!-- Celestial Dashed Circle -->
  <circle cx="250" cy="220" r="162" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 4" stroke-opacity="0.45" />

  <!-- Coordinate Crosshairs -->
  <line x1="55" y1="220" x2="445" y2="220" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 5" stroke-opacity="0.4" />
  <line x1="250" y1="25" x2="250" y2="415" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 5" stroke-opacity="0.4" />

  <!-- Outer Hexagon Frame -->
  <polygon
    points="250,68 382,144 382,296 250,372 118,296 118,144"
    stroke="#0284C7"
    stroke-width="1.8"
    stroke-opacity="0.75"
    fill="none"
  />

  <!-- Inner Hexagon Frame (Dashed) -->
  <polygon
    points="250,86 366,153 366,287 250,354 134,287 134,153"
    stroke="#64748B"
    stroke-width="1.2"
    stroke-dasharray="4 4"
    stroke-opacity="0.5"
    fill="none"
  />

  <!-- Outer Hexagon Vertex Nodes -->
  <!-- Top: Cyan -->
  <circle cx="250" cy="68" r="7" fill="#06B6D4" fill-opacity="0.25" />
  <circle cx="250" cy="68" r="4" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Top-Right: Blue/Violet -->
  <circle cx="382" cy="144" r="7" fill="#6366F1" fill-opacity="0.25" />
  <circle cx="382" cy="144" r="4" fill="#6366F1" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Bottom-Right: Purple -->
  <circle cx="382" cy="296" r="7" fill="#8B5CF6" fill-opacity="0.25" />
  <circle cx="382" cy="296" r="4" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Bottom: Emerald -->
  <circle cx="250" cy="372" r="7" fill="#10B981" fill-opacity="0.25" />
  <circle cx="250" cy="372" r="4" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Bottom-Left: Teal -->
  <circle cx="118" cy="296" r="7" fill="#0D9488" fill-opacity="0.25" />
  <circle cx="118" cy="296" r="4" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Top-Left: Sky Blue -->
  <circle cx="118" cy="144" r="7" fill="#0284C7" fill-opacity="0.25" />
  <circle cx="118" cy="144" r="4" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- ===================================================================== -->
  <!-- 2. SCIENTIFIC GLYPH ACCENTS (+, Δ, chemical bond, ✦)                  -->
  <!-- ===================================================================== -->
  <!-- Plus Sign (Top Left) -->
  <g stroke="#0284C7" stroke-width="2.2" stroke-linecap="round">
    <line x1="160" y1="124" x2="172" y2="124" />
    <line x1="166" y1="118" x2="166" y2="130" />
  </g>

  <!-- Delta / Triangle (Top Right) -->
  <polygon points="346,118 338,132 354,132" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" />

  <!-- Chemical Diatomic Bond (Bottom Left) -->
  <g transform="translate(160, 318)">
    <line x1="0" y1="8" x2="14" y2="0" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="8" r="3" fill="#F43F5E" />
    <circle cx="14" cy="0" r="2.2" fill="#F43F5E" />
  </g>

  <!-- Sparkle Star (Bottom Right) -->
  <g transform="translate(344, 318)">
    <polygon points="6,0 7.8,4.2 12,6 7.8,7.8 6,12 4.2,7.8 0,6 4.2,4.2" fill="#059669" />
  </g>

  <!-- ===================================================================== -->
  <!-- 3. ATOMIC ORBITAL ELLIPSES (Quantum Rings)                            -->
  <!-- ===================================================================== -->
  <!-- Orbit 1 (Tilted Magenta / Purple Track) -->
  <ellipse
    cx="250"
    cy="220"
    rx="132"
    ry="55"
    transform="rotate(-36 250 220)"
    stroke="url(#orbit-purple)"
    stroke-width="3"
    fill="none"
  />

  <!-- Orbit 2 (Tilted Cyan / Blue Track) -->
  <ellipse
    cx="250"
    cy="220"
    rx="132"
    ry="55"
    transform="rotate(36 250 220)"
    stroke="url(#orbit-blue)"
    stroke-width="3"
    fill="none"
  />

  <!-- Glowing Particles on Orbits -->
  <!-- 1. Top-Left Purple Particle -->
  <circle cx="145" cy="148" r="9" fill="#8B5CF6" fill-opacity="0.25" />
  <circle cx="145" cy="148" r="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- 2. Top-Right Soft Blue Particle -->
  <circle cx="355" cy="148" r="9" fill="#3B82F6" fill-opacity="0.25" />
  <circle cx="355" cy="148" r="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- 3. Bottom-Left Cyan Particle -->
  <circle cx="145" cy="292" r="9" fill="#06B6D4" fill-opacity="0.3" filter="url(#soft-glow)" />
  <circle cx="145" cy="292" r="5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />

  <!-- 4. Bottom-Right Radiant Coral/Red Particle (Key Accent) -->
  <circle cx="355" cy="292" r="11" fill="#F43F5E" fill-opacity="0.35" filter="url(#soft-glow)" />
  <circle cx="355" cy="292" r="6" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="353.5" cy="290.5" r="1.5" fill="#FFFFFF" />

  <!-- ===================================================================== -->
  <!-- 4. DNA DOUBLE HELIX (Vertical Intertwined Core)                       -->
  <!-- ===================================================================== -->
  <!-- Horizontal Base Pair Rungs -->
  <!-- Lobe 1 (Top) Rung A -->
  <g stroke="#0D9488" stroke-width="2.2" stroke-linecap="round">
    <line x1="228" y1="138" x2="272" y2="138" />
    <circle cx="228" cy="138" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="272" cy="138" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Lobe 1 (Top) Rung B -->
  <g stroke="#0D9488" stroke-width="2.2" stroke-linecap="round">
    <line x1="220" y1="172" x2="280" y2="172" />
    <circle cx="220" cy="172" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="280" cy="172" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Lobe 2 (Bottom) Rung C -->
  <g stroke="#0D9488" stroke-width="2.2" stroke-linecap="round">
    <line x1="220" y1="268" x2="280" y2="268" />
    <circle cx="220" cy="268" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="280" cy="268" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Lobe 2 (Bottom) Rung D -->
  <g stroke="#0D9488" stroke-width="2.2" stroke-linecap="round">
    <line x1="228" y1="302" x2="272" y2="302" />
    <circle cx="228" cy="302" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="272" cy="302" r="2.8" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- DNA Strand 1 (Emerald/Mint Green) -->
  <path
    d="M 250 96 C 286 96, 294 165, 250 220 C 206 275, 214 344, 250 344"
    stroke="url(#dna-strand-green)"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- DNA Strand 2 (Magenta/Rose Pink) -->
  <path
    d="M 250 96 C 214 96, 206 165, 250 220 C 294 275, 286 344, 250 344"
    stroke="url(#dna-strand-pink)"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Helix Top & Bottom Connecting Nodes -->
  <circle cx="250" cy="96" r="3.5" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.2" />
  <circle cx="250" cy="344" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- Central Crossing Nodes -->
  <circle cx="236" cy="220" r="3" fill="#F43F5E" />
  <circle cx="264" cy="220" r="3" fill="#10B981" />

  <!-- ===================================================================== -->
  <!-- 5. CENTRAL LUMINOUS CORE NODE (Pivotal Truth / Axiom Core)             -->
  <!-- ===================================================================== -->
  <!-- Outer Halos -->
  <circle cx="250" cy="220" r="24" fill="#0284C7" fill-opacity="0.12" filter="url(#core-glow)" />
  <circle cx="250" cy="220" r="14" fill="#06B6D4" fill-opacity="0.25" />
  <!-- Center Core Ring -->
  <circle cx="250" cy="220" r="9" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
  <circle cx="250" cy="220" r="3.5" fill="#0EA5E9" />

  <!-- ===================================================================== -->
  <!-- 6. TYPOGRAPHY (AXIOMA ACADEMY - Clean Deep Slate & Vibrant Cyan)      -->
  <!-- ===================================================================== -->
  <!-- Main Brand Title -->
  <text
    x="250"
    y="472"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="44"
    letter-spacing="0.22em"
    fill="#0F172A"
  >
    AXIOMA
  </text>

  <!-- Subtitle Tagline -->
  <text
    x="250"
    y="520"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="16"
    letter-spacing="0.65em"
    fill="#0D9488"
  >
    ACADEMY
  </text>
</svg>
