<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="440" height="90" fill="none" role="img" aria-labelledby="axioma-horiz-title axioma-horiz-desc">
  <title id="axioma-horiz-title">Axioma Academy — STEM Emblem Horizontal Lockup</title>
  <desc id="axioma-horiz-desc">Compact horizontal brand logo featuring the STEM synthesis emblem and typography</desc>

  <defs>
    <linearGradient id="h-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="h-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="h-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="h-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Scaled Emblem Icon on the Left (Centered at x=45, y=45, scale ~0.22) -->
  <g transform="translate(45, 45) scale(0.22) translate(-250, -220)">
    <!-- Celestial Dashed Circle -->
    <circle cx="250" cy="220" r="162" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 6" stroke-opacity="0.5" />
    <line x1="60" y1="220" x2="440" y2="220" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.4" />
    <line x1="250" y1="30" x2="250" y2="410" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.4" />

    <!-- Outer Hexagon -->
    <polygon points="250,68 382,144 382,296 250,372 118,296 118,144" stroke="#0284C7" stroke-width="3" fill="none" />

    <!-- Atomic Orbits -->
    <ellipse cx="250" cy="220" rx="132" ry="55" transform="rotate(-36 250 220)" stroke="url(#h-purple)" stroke-width="4.5" fill="none" />
    <ellipse cx="250" cy="220" rx="132" ry="55" transform="rotate(36 250 220)" stroke="url(#h-blue)" stroke-width="4.5" fill="none" />

    <!-- Particles -->
    <circle cx="145" cy="148" r="7" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="355" cy="148" r="7" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="145" cy="292" r="7" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="355" cy="292" r="9" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- DNA Double Helix -->
    <path d="M 250 96 C 286 96, 294 165, 250 220 C 206 275, 214 344, 250 344" stroke="url(#h-green)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 250 96 C 214 96, 206 165, 250 220 C 294 275, 286 344, 250 344" stroke="url(#h-pink)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- DNA Base Pairs -->
    <line x1="228" y1="138" x2="272" y2="138" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <line x1="220" y1="172" x2="280" y2="172" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <line x1="220" y1="268" x2="280" y2="268" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
    <line x1="228" y1="302" x2="272" y2="302" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />

    <!-- Core Ring -->
    <circle cx="250" cy="220" r="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
    <circle cx="250" cy="220" r="5" fill="#0EA5E9" />
  </g>

  <!-- Wordmark on Right -->
  <g transform="translate(104, 48)">
    <text
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="34"
      letter-spacing="0.14em"
      fill="#0F172A"
    >
      AXIOMA
    </text>
    <text
      x="2"
      y="26"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="800"
      font-size="12"
      letter-spacing="0.48em"
      fill="#0D9488"
    >
      ACADEMY
    </text>
  </g>
</svg>
