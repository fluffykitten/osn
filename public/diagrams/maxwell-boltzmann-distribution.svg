<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradMB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <!-- Curve Gradients -->
    <linearGradient id="curveT1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="curveT2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="curveT3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05" />
    </linearGradient>

    <!-- Card Filter Drop Shadow -->
    <filter id="shadowMB" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="url(#bgGradMB)" rx="16" />

  <!-- Header Section -->
  <g transform="translate(480, 34)" text-anchor="middle">
    <text fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="0.5">
      DISTRIBUSI KECEPATAN MOLEKULER GAS: MAXWELL-BOLTZMANN
    </text>
    <text y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
      Pengaruh Peningkatan Suhu (T) terhadap Distribusi Kinetik &amp; Analisis Tiga Kecepatan Karakteristik (v_mp, v_avg, v_rms)
    </text>
  </g>

  <!-- PANEL 1: PENGARUH SUHU (T1 < T2 < T3) -->
  <g transform="translate(36, 75)">
    <!-- Container -->
    <rect width="425" height="410" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadowMB)" />

    <!-- Title Badge -->
    <rect x="16" y="16" width="220" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="126" y="35" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
      Pengaruh Suhu pada Gas N₂
    </text>

    <!-- Formula tag -->
    <text x="408" y="34" text-anchor="end" fill="#cbd5e1" font-family="'Cambria Math', serif" font-size="11.5" font-style="italic">
      P(v) = 4π (M / 2πRT)^(3/2) v² e^(-Mv² / 2RT)
    </text>

    <!-- Axes: Origin at (55, 340) -->
    <!-- X-Axis: Kecepatan v (m/s) -->
    <line x1="55" y1="340" x2="400" y2="340" stroke="#64748b" stroke-width="2" />
    <text x="400" y="360" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">
      Kecepatan Molekul v (m/s) →
    </text>

    <!-- Y-Axis: Fraksi Molekul f(v) -->
    <line x1="55" y1="340" x2="55" y2="60" stroke="#64748b" stroke-width="2" />
    <text x="50" y="60" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">
      Fraksi Molekul f(v) ↑
    </text>

    <!-- CURVE 1: T1 = 300 K (Cold / Ruang) -> Peak at x=135, y=95 -->
    <path d="M 55 340 C 70 338, 90 270, 110 180 C 120 130, 128 95, 135 95 C 145 95, 155 130, 180 220 C 210 300, 260 336, 330 340 L 55 340 Z" fill="url(#curveT1Grad)" />
    <path d="M 55 340 C 70 338, 90 270, 110 180 C 120 130, 128 95, 135 95 C 145 95, 155 130, 180 220 C 210 300, 260 336, 330 340" fill="none" stroke="#38bdf8" stroke-width="2.8" />
    <!-- Peak dot & label T1 -->
    <circle cx="135" cy="95" r="4" fill="#38bdf8" />
    <text x="145" y="90" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">T₁ = 300 K</text>

    <!-- CURVE 2: T2 = 600 K (Warm) -> Peak at x=185, y=165 -->
    <path d="M 55 340 C 80 339, 120 290, 150 220 C 168 180, 178 165, 185 165 C 196 165, 215 185, 245 240 C 290 305, 340 335, 380 340 L 55 340 Z" fill="url(#curveT2Grad)" />
    <path d="M 55 340 C 80 339, 120 290, 150 220 C 168 180, 178 165, 185 165 C 196 165, 215 185, 245 240 C 290 305, 340 335, 380 340" fill="none" stroke="#f59e0b" stroke-width="2.8" />
    <!-- Peak dot & label T2 -->
    <circle cx="185" cy="165" r="4" fill="#f59e0b" />
    <text x="195" y="160" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">T₂ = 600 K</text>

    <!-- CURVE 3: T3 = 1000 K (Hot) -> Peak at x=235, y=215 -->
    <path d="M 55 340 C 95 339, 150 300, 190 250 C 215 225, 226 215, 235 215 C 248 215, 275 230, 310 270 C 350 310, 375 330, 400 336 L 55 340 Z" fill="url(#curveT3Grad)" />
    <path d="M 55 340 C 95 339, 150 300, 190 250 C 215 225, 226 215, 235 215 C 248 215, 275 230, 310 270 C 350 310, 375 330, 400 336" fill="none" stroke="#ef4444" stroke-width="2.8" />
    <!-- Peak dot & label T3 -->
    <circle cx="235" cy="215" r="4" fill="#ef4444" />
    <text x="245" y="210" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">T₃ = 1000 K</text>

    <!-- Area Konservasi Luas Catatan -->
    <rect x="55" y="372" width="350" height="26" rx="6" fill="#1e293b" />
    <text x="230" y="389" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
      ★ Luas area di bawah tiap kurva adalah sama (= 1.0 atau 100% molekul).
    </text>
  </g>

  <!-- PANEL 2: TIGA KECEPATAN KARAKTERISTIK & PENGARUH MASSA MOLAR -->
  <g transform="translate(496, 75)">
    <!-- Container -->
    <rect width="428" height="410" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadowMB)" />

    <!-- Title Badge -->
    <rect x="16" y="16" width="240" height="28" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
    <text x="136" y="35" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
      Kecepatan Karakteristik &amp; Massa (M)
    </text>

    <!-- Axes: Origin at (50, 240) for Velocity Diagram -->
    <line x1="50" y1="240" x2="395" y2="240" stroke="#64748b" stroke-width="2" />
    <line x1="50" y1="240" x2="50" y2="60" stroke="#64748b" stroke-width="2" />
    <text x="395" y="258" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">v (m/s) →</text>
    <text x="45" y="60" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">f(v) ↑</text>

    <!-- Single Curve for Characteristic Speed Breakdown -->
    <path d="M 50 240 C 75 239, 105 170, 135 90 C 148 55, 158 55, 165 55 C 178 55, 205 110, 235 170 C 275 220, 325 238, 375 240 L 50 240 Z" fill="#6366f1" fill-opacity="0.15" />
    <path d="M 50 240 C 75 239, 105 170, 135 90 C 148 55, 158 55, 165 55 C 178 55, 205 110, 235 170 C 275 220, 325 238, 375 240" fill="none" stroke="#818cf8" stroke-width="2.5" />

    <!-- 1. v_mp (Most Probable) -> At peak x=165 -->
    <line x1="165" y1="55" x2="165" y2="240" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="165" cy="55" r="4" fill="#10b981" />
    <rect x="135" y="244" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="165" y="258" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">v_mp</text>

    <!-- 2. v_avg (Average) -> At x=186 (1.128 * v_mp) -->
    <line x1="186" y1="80" x2="186" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="186" cy="80" r="3.5" fill="#38bdf8" />
    <rect x="175" y="268" width="60" height="20" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <text x="205" y="282" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">v_avg (v̄)</text>

    <!-- 3. v_rms (Root-Mean-Square) -> At x=202 (1.225 * v_mp) -->
    <line x1="202" y1="105" x2="202" y2="240" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="202" cy="105" r="3.5" fill="#f43f5e" />
    <rect x="220" y="244" width="60" height="20" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1" />
    <text x="250" y="258" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">v_rms</text>

    <!-- Mathematical Comparison Box -->
    <rect x="18" y="295" width="392" height="103" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <text x="30" y="316" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">
      Hubungan Urutan: <tspan fill="#10b981">v_mp</tspan> &lt; <tspan fill="#38bdf8">v_avg</tspan> &lt; <tspan fill="#f43f5e">v_rms</tspan>
    </text>

    <!-- Row 1: v_mp -->
    <text x="30" y="338" fill="#a7f3d0" font-family="'Cambria Math', serif" font-size="12">
      • v_mp = √(2RT / M) ≈ 1.414 √(RT/M)
    </text>
    <text x="260" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
      [Puncak probabilitas]
    </text>

    <!-- Row 2: v_avg -->
    <text x="30" y="358" fill="#bae6fd" font-family="'Cambria Math', serif" font-size="12">
      • v_avg = √(8RT / πM) ≈ 1.596 √(RT/M)
    </text>
    <text x="260" y="358" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
      [Rerata aritmetika]
    </text>

    <!-- Row 3: v_rms -->
    <text x="30" y="378" fill="#fecdd3" font-family="'Cambria Math', serif" font-size="12">
      • v_rms = √(3RT / M) ≈ 1.732 √(RT/M)
    </text>
    <text x="260" y="378" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
      [Energi Kinetik Ek = ³/₂ kT]
    </text>
  </g>
</svg>
