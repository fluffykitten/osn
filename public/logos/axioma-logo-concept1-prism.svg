<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none" role="img" aria-labelledby="c1-title c1-desc">
  <title id="c1-title">Axioma Academy — The Apex Prism Logo</title>
  <desc id="c1-desc">Architectural monogram A with 4 faceted STEM discipline colors (Teal, Blue, Purple, Green)</desc>
  <defs>
    <linearGradient id="prism-teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="prism-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="prism-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="prism-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Icon Symbol: Apex Prism Monogram A -->
  <g transform="translate(10, 8)">
    <!-- Left Pillar (Kimia - Teal) -->
    <polygon points="26,6 10,54 22,54 32,24" fill="url(#prism-teal)" />
    <!-- Right Pillar (Fisika - Blue) -->
    <polygon points="34,6 28,24 38,54 50,54" fill="url(#prism-blue)" />
    <!-- Top Apex Cap (Biologi - Green) -->
    <polygon points="30,2 26,6 34,6" fill="url(#prism-green)" />
    <!-- Crossbar Core (Matematika - Purple) -->
    <polygon points="20,34 40,34 36,42 24,42" fill="url(#prism-purple)" />
    <!-- Central Spark Accent -->
    <circle cx="30" cy="27" r="2.2" fill="#F59E0B" />
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(75, 45)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
      Axioma
    </text>
    <text x="102" y="-1" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#64748B">
      ACADEMY
    </text>
  </g>
</svg>
